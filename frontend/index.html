<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Simple Frontend</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem }
    textarea { width: 100%; height: 120px }
    button { padding: 8px 12px }
    pre { background: #f4f4f4; padding: 12px }
  </style>
</head>
<body>
  <h1>Simple Frontend</h1>
  <p>Enter text and send to backend to create (optionally embedded) document.</p>
  <textarea id="content">Hello from frontend</textarea>
  <br/><br/>
  <button id="send">Send</button>
  <h3>Response</h3>
  <pre id="resp">----</pre>

  <script>
    document.getElementById('send').addEventListener('click', async () => {
      const content = document.getElementById('content').value;
      try {
        const res = await fetch('/api/embeddings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        const data = await res.json();
        document.getElementById('resp').textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        document.getElementById('resp').textContent = String(e);
      }
    });
  </script>
</body>
</html>
